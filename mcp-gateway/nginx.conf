# MCP 网关 nginx 配置（本地开发版：HTTP 明文 9080；生产启用 443 SSL）
# 对应《MCP网关详细设计文档》7.1 节

user  root;
worker_processes  auto;
pid /var/run/mcp-gateway-nginx.pid;
error_log /var/log/nginx/mcp-error.log warn;

# 环境变量声明（由启动脚本注入，init_by_lua 经 os.getenv 读取）
env REDIS_HOST;
env REDIS_PORT;
env IDP_BASE_URL;
env ADMIN_BASE_URL;
env INTERNAL_KEY;
env GATEWAY_CLIENT_ID;
env GATEWAY_CLIENT_SECRET;
env GATEWAY_AUD;

events {
    worker_connections 10240;
    use epoll;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 2m;

    # DNS 解析器（systemd-resolved；供上游域名解析）
    resolver 127.0.0.53 ipv6=off valid=10s;
    resolver_timeout 3s;

    lua_package_path "/mnt/d/code/ai/agent-gateway/mcp-gateway/lua/?.lua;;";

    lua_shared_dict mcp_cache 20m;
    lua_shared_dict mcp_locks 2m;
    lua_shared_dict mcp_audit 10m;

    init_by_lua_file       /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/init.lua;
    init_worker_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/init_worker.lua;

    log_format mcp_json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","server":"$mcp_server_id",'
        '"tool":"$mcp_tool_name","rpc":"$mcp_rpc_method","caller":"$mcp_caller",'
        '"user":"$mcp_user","status":$status,"rt":$request_time,'
        '"upstream_rt":"$mcp_upstream_rt","decision":"$mcp_decision","err":"$mcp_error"}';

    server {
        listen 9080;
        server_name _;
        access_log /var/log/nginx/mcp-access.log mcp_json;

        # ---- 内部端点 ----
        location = /healthz {
            access_log off;
            default_type application/json;
            return 200 '{"status":"ok"}';
        }

        location = /readyz {
            access_log off;
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/readyz.lua;
        }

        location = /statusz {
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/statusz.lua;
        }

        location = /admin/invalidate {
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/invalidate.lua;
        }

        # ---- MCP 主端点 (Streamable HTTP) ----
        location ~ "^/(?<sid>[a-z0-9][a-z0-9-]{1,62})/mcp/?$" {
            set $mcp_server_id $sid;
            set $mcp_tool_name "";
            set $mcp_rpc_method "";
            set $mcp_caller "";
            set $mcp_user "";
            set $mcp_upstream_rt "";
            set $mcp_decision "";
            set $mcp_error "";
            access_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/access.lua;
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/proxy.lua;
            log_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/audit.lua;
        }

        # ---- 旧版 HTTP+SSE 传输 ----
        location ~ "^/(?<sid>[a-z0-9][a-z0-9-]{1,62})/sse/?$" {
            set $mcp_server_id $sid;
            set $mcp_tool_name "";
            set $mcp_rpc_method "";
            set $mcp_caller "";
            set $mcp_user "";
            set $mcp_upstream_rt "";
            set $mcp_decision "";
            set $mcp_error "";
            access_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/access_sse.lua;
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/proxy_sse.lua;
            log_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/audit.lua;
        }

        location ~ "^/(?<sid>[a-z0-9][a-z0-9-]{1,62})/messages/?$" {
            set $mcp_server_id $sid;
            set $mcp_tool_name "";
            set $mcp_rpc_method "";
            set $mcp_caller "";
            set $mcp_user "";
            set $mcp_upstream_rt "";
            set $mcp_decision "";
            set $mcp_error "";
            access_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/access.lua;
            content_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/proxy_messages.lua;
            log_by_lua_file /mnt/d/code/ai/agent-gateway/mcp-gateway/lua/audit.lua;
        }
    }
}
