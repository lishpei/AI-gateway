# A2A Agent 网关 nginx 配置（本地开发版：HTTP 9081）
# 对应《Agent网关详细设计文档》6.1 节

user  root;
worker_processes  auto;
pid /var/run/a2a-gateway-nginx.pid;
error_log /var/log/nginx/a2a-error.log warn;

# 环境变量（启动脚本注入）
env REDIS_HOST;
env REDIS_PORT;
env ADMIN_BASE_URL;
env NODE_TOKEN;
env NODE_ID;

events {
    worker_connections 10240;
    use epoll;
}

http {
    include       /usr/local/openresty/nginx/conf/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;
    client_max_body_size 4m;

    resolver 127.0.0.53 ipv6=off valid=10s;
    resolver_timeout 3s;

    lua_package_path "/mnt/d/code/ai/agent-gateway/a2a-gateway/lua/?.lua;;";

    lua_shared_dict agent_cache 10m;
    lua_shared_dict caller_cache 10m;

    init_by_lua_file       /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/init.lua;
    init_worker_by_lua_file /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/init_worker.lua;

    log_format a2a_json escape=json
        '{"ts":"$time_iso8601","request_id":"$request_id","agent":"$a2a_agent_id",'
        '"caller":"$a2a_caller_id","rpc_method":"$a2a_rpc_method","status":$status,'
        '"bytes":$body_bytes_sent,"rt":$request_time,"upstream_rt":"$a2a_upstream_rt",'
        '"upstream_status":"$a2a_upstream_status","err":"$a2a_error_code"}';

    server {
        listen 9081;
        server_name _;
        access_log /var/log/nginx/a2a-access.log a2a_json;

        # ---- 节点状态（内网） ----
        location = /statusz {
            content_by_lua_file /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/statusz.lua;
        }

        # ---- 端点1: Agent Card 发现 ----
        location ~ "^/(?<agent_id>[a-z0-9][a-z0-9-]{1,62})/\.well-known/agent-card\.json$" {
            set $a2a_agent_id $agent_id;
            set $a2a_caller_id "";
            set $a2a_rpc_method "";
            set $a2a_upstream_rt "";
            set $a2a_upstream_status "";
            set $a2a_error_code "";
            content_by_lua_file /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/card.lua;
        }

        # ---- 端点2: A2A 代理入口 ----
        location ~ "^/(?<agent_id>[a-z0-9][a-z0-9-]{1,62})/a2a/?$" {
            set $a2a_agent_id $agent_id;
            set $a2a_caller_id "";
            set $a2a_rpc_method "";
            set $a2a_upstream_rt "";
            set $a2a_upstream_status "";
            set $a2a_error_code "";
            access_by_lua_file /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/auth_caller.lua;
            content_by_lua_file /mnt/d/code/ai/agent-gateway/a2a-gateway/lua/proxy.lua;
        }
    }
}
