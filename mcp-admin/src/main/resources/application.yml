server:
  port: 8080

spring:
  application:
    name: mcp-admin
  profiles:
    active: dev
  servlet:
    encoding:
      charset: UTF-8
      force: true
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
  global-config:
    banner: false
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# 管理台自身配置
mcp:
  # 内部接口密钥(审计上报/失效通知), 与网关 X-Internal-Key 对应
  internal-key: dev-internal-key-2026
  # IdP 配置(dev 指向内嵌 Mock, 生产指向企业认证中心)
  idp:
    base-url: http://localhost:8080/idp-mock
    client-id: mcp-gateway
    client-secret: dev-gateway-secret
  # 管理台管理员Token(一期简化认证)
  admin-token: dev-admin-token-2026

logging:
  level:
    root: info
    com.corp.mcp: debug

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:mysql://localhost:3306/mcp_admin?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: mcp
    password: mcp123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 3000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # WSL Redis 就绪后改为 true
